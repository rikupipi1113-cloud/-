[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"
[project]
name = "erdos-straus-research"
version = "0.1.0"
requires-python = ">=3.10,<3.11"
dependencies = ["sympy==1.14.0", "numpy==2.2.6", "mpmath==1.3.0", "jsonschema==4.25.1"]
[project.optional-dependencies]
dev = ["pytest==8.4.2", "cmake==3.31.6"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
[tool.setuptools.packages.find]
where = ["src"]
